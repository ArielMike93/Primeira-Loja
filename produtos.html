<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minha Loja - Produtos</title>
  <!-- Conectando com o MESMO arquivo CSS -->
  <link rel="stylesheet" href="CSS/style.css">
</head>
<body>

  <!-- Cabeçalho (igual ao da index.html, alterando apenas a classe active) -->
  <header class="site-header">
    <div class="container header-container">
      <h1 class="logo">Nerd Gyn</h1>
      <nav class="nav-menu">
        <ul>
          <li><a href="index.html">Início</a></li>
          <!-- Aqui ativamos o destaque visual para a aba "Produtos" -->
          <li><a href="produtos.html" class="active">Produtos</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- Conteúdo Principal EXCLUSIVO dos Produtos -->
  <main class="container">
    <section class="products-section">
      <h2>Nossos Produtos</h2>

      <div class="product-grid">
        <!-- Cartão de Produto 1 -->
        <article class="product-card">
          <img src="image/Screenshot_11.png" alt="Camisa Castlevania">
          <div class="product-info">
            <h3>Camisa Castlevania</h3>
            <p class="description">Camisa preta 100% algodão com estampa de Castlevania.</p>
            <span class="price">R$ 79,90</span>
            <button class="buy-btn">Comprar</button>
          </div>
        </article>

        <!-- Cartão de Produto 2 -->
        <article class="product-card">
          <img src="image/Screenshot_12.png" alt="Camisa Jurassic Park">
          <div class="product-info">
            <h3>Camisa Jurassic Park</h3>
            <p class="description">Camisa preta com estampa retrô de Jurassic Park.</p>
            <span class="price">R$ 89,90</span>
            <button class="buy-btn">Comprar</button>
          </div>
        </article>

        <!-- Cartão de Produto 3 -->
        <article class="product-card">
          <img src="image/Screenshot_13.png" alt="Camisa Hellsing">
          <div class="product-info">
            <h3>Camisa Hellsing</h3>
            <p class="description">Camisa preta com estampa estilizada de Hellsing.</p>
            <span class="price">R$ 84,90</span>
            <button class="buy-btn">Comprar</button>
          </div>
        </article>
      </div>
    </section>
  </main>

</body>
</html>
